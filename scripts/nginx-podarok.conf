# Лендинг podarok.sozdaipesnu.ru — статика, не студия.
# SSL допишет certbot при первом install-podarok.sh
server {
    listen 80;
    listen [::]:80;
    server_name podarok.sozdaipesnu.ru;

    root /var/www/podarok;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|css|js|woff2|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
